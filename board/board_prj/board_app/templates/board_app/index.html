<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>방명록 작성</h2>
    
    <form method="POST">
        {% csrf_token %}
        Username : <input type="text" name="username"><br><br>
        Stdnum : <input type="text" name="stdnum"><br><br>
        Message - <textarea name="message"></textarea><br><br>
        <button type="submit">작성하기</button><hr>
    </form>

    
    <h2>방명록 목록</h2>
    {% for board in boardlist %}
        {{ board.username }} [{{ board.stdnum }}] - {{ board.message }}<br>
    {% empty %}
        아직 방명록이 없습니다.
    {% endfor %}
</body>
</html>
