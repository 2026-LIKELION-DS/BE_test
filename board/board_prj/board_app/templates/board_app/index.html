<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>create</h2>
    <form method="POST">
      {% csrf_token %} {{form.as_p}}
      <button type="submit">save</button>

    <hr />

    {% for Guest in guests %}

    <br />

    {% empty %}
    <a>x </a> {% endfor %}
  </body>
</html>
