<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>학생 목록</h1>

    {% for student in students %}
        <p>- {{ student.student_id }} {{ student.name }}</p>
        
        
        {% for lecture in lectures %}
            <p>수강 강의: - {{ lecture.code }} {{ lecture.title }}</p>
        {% empty %}
            <p>수강 중인 강의가 없습니다.</p>
        {% endfor %}
        
        <hr> {% empty %}
        <p>등록된 학생이 없습니다.</p>
    {% endfor %}
</body>
</html>
