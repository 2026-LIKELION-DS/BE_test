<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>학생 목록</h2>
    {% for student in students %}
    <h4>- {{student.student_id}} {{ student.name }}</h4>
    수강 강의:<br>
        - {{ student.lecture.code }} {{ student.lecture.title }}<br><hr>

    {% empty %}
    등록된 학생이 없습니다.
    {% endfor %}
</body>
</html>
